version: 2
updates:
  # For Gradle, update dependencies and plugins to the latest non-major version
  - package-ecosystem: "gradle"
    groups:
      dependencies:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
      # Error Prone runs inside javac and SpotBugs runs on a worker JVM, and both are launched
      # from the compilation toolchain, which is still Java 8 for every module except ledger.
      # Error Prone 2.11 and later require JDK 11 or later, and SpotBugs 4.9.0 raised its minimum
      # runtime to Java 11. Keep them pinned until the Java 8 toolchain is dropped.
      - dependency-name: "com.google.errorprone:*"
      - dependency-name: "com.github.spotbugs:*"

  # For GitHub Actions, update all actions on the default, support and release branches
  - package-ecosystem: "github-actions"
    groups:
      actions on branch master:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3"
    groups:
      actions on branch 3:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3.14"
    groups:
      actions on branch 3.14:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3.13"
    groups:
      actions on branch 3.13:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3.12"
    groups:
      actions on branch 3.12:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3.11"
    groups:
      actions on branch 3.11:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

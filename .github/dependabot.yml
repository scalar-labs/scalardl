version: 2
updates:
  # For Gradle, update dependencies and plugins to the latest non-major version
  - package-ecosystem: "gradle"
    groups:
      dependencies:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
      # Error Prone runs inside javac and SpotBugs runs on a worker JVM, and both are launched
      # from the compilation toolchain, which is still Java 8 for every module except ledger.
      # Error Prone 2.11 and later require JDK 11 or later, and SpotBugs 4.9.0 raised its minimum
      # runtime to Java 11. Keep them pinned until the Java 8 toolchain is dropped.
      - dependency-name: "com.google.errorprone:*"
      - dependency-name: "com.github.spotbugs:*"

  # For GitHub Actions, update all actions on the default, support and release branches
  - package-ecosystem: "github-actions"
    groups:
      actions on branch master:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3"
    groups:
      actions on branch 3:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3.14"
    groups:
      actions on branch 3.14:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3.13"
    groups:
      actions on branch 3.13:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    target-branch: "3.12"
    groups:
      actions on branch 3.12:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  # For Docker, update the base images pinned in the Dockerfiles on the default branch only
  # The support and release branches are not covered here because base image updates are applied to them
  # by backporting the changes merged into the default branch
  # When a new Dockerfile that pins its base image is added, add its directory to the "directories" list below
  # /schema-loader is not listed because its base image tag is given by the SCALARDB_VERSION build argument,
  # so there is no pinned image for Dependabot to update
  # The hadolint image in /scripts/docker/hadolint is used by scripts/docker/lint.sh to lint Dockerfiles. It has
  # its own group so that a hadolint update (including major versions, which may change the lint rules and fail
  # the lint job) never blocks the base image updates in the same PR
  # Major version updates of the JRE base image are ignored because upgrading the Java runtime
  # of the released images is a manual decision; the other base image updates are grouped into a single PR
  - package-ecosystem: "docker"
    groups:
      container images on branch master:
        patterns:
          - "*"
        exclude-patterns:
          - "hadolint/hadolint"
      hadolint on branch master:
        patterns:
          - "hadolint/hadolint"
    directories:
      - "/client"
      - "/ledger"
      - "/scripts/docker/hadolint"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
    schedule:
      interval: "weekly"
